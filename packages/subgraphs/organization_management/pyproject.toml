[tool.coverage.run]
branch = true
source = [ "organization_management" ]

[tool.coverage.report]
exclude_lines = ['if TYPE_CHECKING:']
show_missing = true

[tool.pytest.ini_options]
addopts = """
 --cov
 --cov-report html:'../../../coverage/packages/subgraphs/organization_management/html'
 --cov-report xml:'../../../coverage/packages/subgraphs/organization_management/coverage.xml'
 --html='../../../reports/packages/subgraphs/organization_management/unittests/html/index.html'
 --junitxml='../../../reports/packages/subgraphs/organization_management/unittests/junit.xml'
"""

[project]
name = "organization_management"
version = "1.0.0"
description = "Organization management"
requires-python = ">=3.9,<4"
readme = 'README.md'
dependencies = [
  "strawberry-graphql[cli]",
  "fastapi",
  "dotenv",
  "uvicorn",
  "httpx2"
]


[dependency-groups]
dev = [
  "autopep8>=2.3.1",
  "ruff>=0.8.2",
  "pytest>=8.3.4",
  "pytest-sugar>=1.0.0",
  "pytest-cov>=6.0.0",
  "pytest-html>=4.1.1",
]

[tool.uv]
package = false

[tool.ruff]
exclude = [
  ".ruff_cache",
  ".svn",
  ".tox",
  ".venv",
  "dist",
]

line-length = 88
indent-width = 4

[tool.ruff.lint]
select = [
  # pycodestyle
  "E",
  # Pyflakes
  "F",
  # pyupgrade
  "UP",
  # flake8-bugbear
  "B",
  # flake8-simplify
  "SIM",
  # isort
  "I",
]
ignore = []

fixable = ["ALL"]
unfixable = []
