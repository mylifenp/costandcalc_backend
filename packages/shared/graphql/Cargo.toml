[package]
name = "shared_graphql"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shared_auth = { path = '../auth' }

[dependencies.async-graphql]
version = "7.2.1"
features = ["chrono"]

[dependencies.axum]
version = "0.8.9"

[dependencies.tokio]
version = "1.53.1"
features = ["full"]

