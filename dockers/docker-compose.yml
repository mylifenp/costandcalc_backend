services:
  compose-config:
    image: node:24-alpine

    volumes:
      - router-data:/data
      - ./graph.production.yml:/work/graph.production.yml:ro
    command: >
      sh -c "
        npm install -g wgc@latest &&
        wgc router compose -i /work/graph.production.yml -o /data/router.json
      "

  router:
    container_name: cosmo-router
    image: ghcr.io/wundergraph/cosmo/router:latest
    depends_on:
      compose-config:
        condition: service_completed_successfully
      redis:
        condition: service_started
    env_file:
      - ./.env
    environment:
      CONFIG_PATH: /etc/router/router-config.yml
    ports:
      - '8099:8099'

    volumes:
      - ./router-config.yml:/etc/router/router-config.yml:ro
      - router-data:/data

  subgraphs_admin:
    image: mylifenp/subgraphs_admin:latest
    container_name: subgraphs_admin
    ports:
      - '8001:8001'
    restart: always
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://localhost:8001/health"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      mongodb:
        condition: service_started
      redis:
        condition: service_started
      redis-ps:
        condition: service_started
      minio:
        condition: service_started
      qdrant:
        condition: service_started
    env_file:
      - ./.env

  subgraphs_assets:
    image: mylifenp/subgraphs_assets:latest
    container_name: subgraphs_assets
    ports:
