    container_name: subgraphs_organization_management
    ports:
      - '8009:8001'
    restart: always
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://localhost:8001/health"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      mongodb:
        condition: service_started
      redis:
        condition: service_started
      redis-ps:
        condition: service_started
      minio:
        condition: service_started
      qdrant:
        condition: service_started
    env_file:
      - ./.env

  mongodb:
    image: 'mongo:8-noble'
    restart: 'always'
    container_name: 'mongodb'
    stop_grace_period: 30s
    command: ['mongod', '--config', '/etc/mongod.conf']
    env_file:
      - ./.docker/database/.env
    volumes:
      - ./.docker/database/mongod.conf:/etc/mongod.conf:ro
      - ./.docker/database/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
      - mongodb-data:/data/db
      - ./.docker/database/data/log/:/var/log/mongodb/
    ports:
      - '27017:27017'

  redis:
    image: 'redis/redis-stack:latest'
    container_name: 'redis'
    restart: 'always'
    ports:
      - '6379:6379'
    volumes:
      - ./.docker/redis/redis.conf:/usr/local/etc/redis/redis.conf
      - ./.docker/redis/redis-data:/data
    env_file:
      - ./.docker/redis/.env

  redis-ps:
    image: 'redis:8.2.3'
    container_name: 'redis-ps'
    restart: 'always'
    ports:
      - '6378:6379'
    volumes:
      - ./.docker/redis/redis-ps.conf:/usr/local/etc/redis/redis.conf
      - ./.docker/redis/redis-ps-data:/data
    env_file:
      - ./.docker/redis/.env
    command:
      - redis-server
      - /usr/local/etc/redis/redis.conf

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: 'minio'
    restart: 'always'
    ports:
      - '9010:9000'
      - '9011:9001'
    volumes:
      - ./.docker/minio/minio-data:/data
    env_file:
      - ./.docker/minio/.env
    command: ['server', '--console-address', ':9001', '/minio-data']

  minio-buckets:
    image: quay.io/minio/mc:latest
    depends_on:
      - minio
    restart: on-failure
    env_file:
      - ./.docker/minio/.env
    entrypoint: >
      /bin/sh -c "
      until /usr/bin/mc alias set dockerminio http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD}; do sleep 1; done;
      /usr/bin/mc mb --ignore-existing dockerminio/$${MINIO_DEFAULT_BUCKETS};
      exit 0;
      "

  qdrant:
    image: mylifenp/qdrant:1.19.0   # pin the version, don't use :latest
    container_name: qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"   # REST
      - "127.0.0.1:6334:6334"   # gRPC
    volumes:
      - ./qdrant_config/production.yaml:/qdrant/config/production.yaml:ro
      - qdrant-storage:/qdrant/storage
      - ./qdrant_config/production.yaml:/qdrant/config/production.yaml:ro
    environment:
      - QDRANT__SERVICE__API_KEY=${QDRANT_API_KEY}
      - QDRANT__SERVICE__ENABLE_TLS=false   # set true if terminating TLS at Qdrant itself
      - QDRANT__LOG_LEVEL=INFO
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 8G
        reservations:
          cpus: "2"
          memory: 4G
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:6333/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

volumes:
  mongodb-data:
    driver: local
  redis-data:
    driver: local
  minio-data:
    driver: local
  router-data:
    driver: local
  qdrant-storage:
    driver: local

networks:
  default:
