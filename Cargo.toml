
[workspace]
resolver = '2'
members = [
	'packages/libs',
	'packages/shared',
	'packages/subgraphs/identity',
	'packages/subgraphs/assets',
	'packages/subgraphs/estimation',
	'packages/subgraphs/work',
	'packages/subgraphs/billing',
	'packages/subgraphs/media',
	'packages/subgraphs/notification',
	'packages/subgraphs/admin',
	'packages/shared/graphql',
	'packages/shared/auth',
