  deploy-on-vps:
    needs:
      - main
      - build-subgraphs-admin
      - build-subgraphs-assets
      - build-subgraphs-billing
      - build-subgraphs-estimate
      - build-subgraphs-identity
      - build-subgraphs-media
      - build-subgraphs-notification
      - build-subgraphs-work
    runs-on: ubuntu-latest
    if: |
      always() &&
        (
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/develop')
        ) &&
        needs.main.result == 'success' &&
        contains(fromJSON('["success","skipped"]'), needs.build-subgraphs-admin.result) &&
        contains(fromJSON('["success","skipped"]'), needs.build-subgraphs-assets.result) &&
        contains(fromJSON('["success","skipped"]'), needs.build-subgraphs-billing.result) &&
        contains(fromJSON('["success","skipped"]'), needs.build-subgraphs-estimate.result) &&
        contains(fromJSON('["success","skipped"]'), needs.build-subgraphs-identity.result) &&
        contains(fromJSON('["success","skipped"]'), needs.build-subgraphs-media.result) &&
        contains(fromJSON('["success","skipped"]'), needs.build-subgraphs-notification.result) &&
        contains(fromJSON('["success","skipped"]'), needs.build-subgraphs-work.result)
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Copy Docker Compose file to server
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass
          sshpass -p "${{ secrets.PASSPHRASE }}" scp -o StrictHostKeyChecking=no dockers/docker-compose.yml "${{ secrets.VPS_USER }}"@"${{ secrets.VPS_HOST }}":~/costandcalc_backend/
          sshpass -p "${{ secrets.PASSPHRASE }}" scp -o StrictHostKeyChecking=no router-config.yml "${{ secrets.VPS_USER }}"@"${{ secrets.VPS_HOST }}":~/costandcalc_backend/
          sshpass -p "${{ secrets.PASSPHRASE }}" scp -o StrictHostKeyChecking=no graph.production.yml "${{ secrets.VPS_USER }}"@"${{ secrets.VPS_HOST }}":~/costandcalc_backend/

      - name: Deploy to VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}
          script: |
            cd ~/costandcalc_backend
            docker compose pull
            docker compose up -d
